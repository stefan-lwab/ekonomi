services:
  app:
    image: ghcr.io/erp-mafia/gnubok:${IMAGE_TAG:-latest}

    env_file:
      - /etc/dokploy/compose/ekonomi-w58yuh/runtime.env

    expose:
      - "3000"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true
    init: true

    tmpfs:
      - /tmp
      - /app/.next:uid=1001,gid=1001,mode=750,size=400m
      - /app/public:uid=1001,gid=1001,mode=750,size=200m

    mem_limit: 1g
    pids_limit: 200
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - dokploy-network

  cron:
    build:
      context: docker
      dockerfile: cron.Dockerfile

    depends_on:
      app:
        condition: service_healthy

    env_file:
      - /etc/dokploy/compose/ekonomi-w58yuh/runtime.env

    environment:
      APP_URL: http://app:3000

    volumes:
      - ./docker/crontab.self-hosted:/etc/supercronic/crontab:ro

    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    mem_limit: 64m
    pids_limit: 30
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
